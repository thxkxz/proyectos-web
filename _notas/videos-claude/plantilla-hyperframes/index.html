<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #161211;
        --panel: #221b19;
        --line: #3a2d29;
        --ink: #f4ece8;
        --muted: #8a7a74;
        --accent: #e8735a;
        --font-display: "Bebas Neue", "Oswald", Impact, sans-serif;
        --font-ui: "DejaVu Sans", sans-serif;
        --font-mono: "DejaVu Sans Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root {
        width: 100%; height: 100%; position: relative; font-family: var(--font-ui); color: var(--ink);
        background: radial-gradient(60% 40% at 50% 45%, #3a1f18 0%, var(--ground) 70%);
      }
      .hud { position: absolute; top: 140px; left: 60px; right: 60px; display: flex; justify-content: space-between; align-items: flex-end; border-top: 3px solid var(--accent); padding-top: 28px; }
      .hud h1 { font-family: var(--font-display); font-size: 96px; line-height: .9; letter-spacing: .01em; }
      .hud h1 span { color: var(--accent); }
      .clock { font-family: var(--font-mono); font-size: 110px; color: var(--accent); text-shadow: 0 0 30px #e8735a88; }
      .card { position: absolute; left: 60px; right: 60px; top: 520px; background: var(--panel); border: 2px solid var(--line); border-radius: 24px; padding: 40px; }
      .bubble { font-size: 40px; padding: 22px 30px; border-radius: 22px; margin-bottom: 26px; max-width: 78%; opacity: 0; }
      .in { background: #2f2522; }
      .out { background: var(--accent); color: #1a0f0c; margin-left: auto; }
      .caption { position: absolute; bottom: 430px; width: 100%; text-align: center; font-size: 64px; font-weight: 700; }
      .caption .w { display: inline-block; opacity: 0; margin: 0 8px; }
      .caption .hl { color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <header class="hud clip" data-start="0" data-duration="6">
        <h1>TU WHATSAPP<br /><span>ATENDIENDO SOLO</span></h1>
        <div class="clock" id="clock">29:59</div>
      </header>
      <section class="card clip" data-start="0" data-duration="6">
        <p class="bubble in" id="b1">¿Tienen turno el jueves?</p>
        <p class="bubble out" id="b2">Sí, a las 14:00 o 16:30</p>
        <p class="bubble in" id="b3">Dame las 16:30</p>
      </section>
      <p class="caption clip" data-start="0" data-duration="6">
        <span class="w">El</span><span class="w hl">agente</span><span class="w">responde</span><span class="w hl">solo.</span>
      </p>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from(".hud", { y: -60, opacity: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.from(".card", { y: 80, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.3);
      ["#b1", "#b2", "#b3"].forEach((id, i) => {
        tl.fromTo(id, { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, 1 + i * 1.1);
      });
      tl.to(".caption .w", { opacity: 1, duration: 0.15, stagger: 0.35 }, 1.2);
      const clock = document.getElementById("clock");
      const c = { s: 1799 };
      tl.to(c, { s: 1793, duration: 6, ease: "none", onUpdate: () => {
        const v = Math.round(c.s);
        clock.textContent = String(Math.floor(v / 60)).padStart(2, "0") + ":" + String(v % 60).padStart(2, "0");
      } }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
